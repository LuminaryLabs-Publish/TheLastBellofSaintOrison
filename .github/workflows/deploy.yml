name: Deploy playable game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real browser input and production startup
        timeout-minutes: 8
        run: node tools/review/ci.mjs
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: captures/browser/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time repository setting: Settings > Pages > Source > GitHub Actions.
      # GITHUB_TOKEN cannot enable a disabled Pages site.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
